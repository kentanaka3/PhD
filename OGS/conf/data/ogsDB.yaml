_target_: src.ogsdata.OGSSquirrelDataSource

env: ogsDB
persistent: v1
check: false
index_workers: null
copy_to_tmp: true
filesystem_groups: true
paths:
  - ${oc.env:WAVE_PATH,/leonardo_work/IscrC_AISeism/WORK/waveform}
  - ${oc.env:STATION_PATH,/leonardo_work/IscrC_AISeism/WORK/waveform/station}

channel_priorities:
  - HH?
  - EH?
  - HN?
  - HG?
  - BH?
starttime: "2022-01-01"
endtime: "2022-12-31"

velocity_model:
  _target_: pandas.read_csv
  filepath_or_buffer: data/VelocityModel/1D/VelocityModel.csv
